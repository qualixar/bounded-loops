name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-room:
    name: clean-room / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record Git baseline for explicit loop execution
        run: git --version
      - name: Install package and build tooling
        run: python -m pip install build .
      - name: Verify README and package contracts
        run: python -m pytest -q tests/release/test_package_contract.py
      - name: Verify documented loop output
        run: python scripts/verify_readme_outputs.py
      - name: Verify wheel in a clean environment
        run: python scripts/verify_clean_room.py

  core:
    name: deterministic core / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Run deterministic offline suite
        run: uv run pytest -q
      - name: Lint deterministic source and tests
        run: uv run ruff check --no-cache bounded_loops tests
      - name: Type-check runtime and tests
        run: uv run mypy bounded_loops tests
      - name: Audit loop catalog
        run: uv run python -m bounded_loops.cli audit-loops --json

  macos-egress-cage:
    name: macOS OS egress cage (live) / py${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      # The ALLOWLIST egress tests are skipif-gated on a REAL Seatbelt cage. On a runner
      # that cannot enforce one they would SKIP, and this job would report success while
      # proving nothing — the exact blind spot this job exists to close. So assert the
      # capability first, with the engine's own probe, and fail loudly if it is absent.
      - name: Assert this runner can enforce the OS egress cage
        run: |
          uv run python - <<'PY'
          from bounded_loops.graph.adapters.enforcement.capabilities import probe_platform

          caps = probe_platform()
          print(f"seatbelt={caps.seatbelt} egress_proxy={caps.egress_proxy}")
          if not (caps.seatbelt and caps.egress_proxy):
              raise SystemExit(
                  "this macOS runner cannot enforce the loopback egress cage, so the live "
                  "ALLOWLIST tests would silently skip - failing instead of passing blind"
              )
          PY
      - name: Run the deterministic suite with the cage live
        run: uv run pytest -q -rs

  optional-python-gates:
    name: optional Python gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Python gate tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install semgrep great_expectations
      - name: Run opt-in Python tool E2E tests
        run: pytest -q --override-ini='addopts=' -m external_tool tests/release/test_optional_external_e2e.py -k "semgrep or great_expectations"

  optional-node-gates:
    name: opt-in network Node gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and promptfoo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm install -g promptfoo
      - name: Test npm launcher version parity
        working-directory: npm
        run: npm test
      - name: Run opt-in network promptfoo E2E test
        run: pytest -q --override-ini='addopts=' -m "external_tool and network" tests/release/test_optional_external_e2e.py -k promptfoo

  optional-security-gates:
    name: optional security gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Install package and gitleaks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run opt-in security gate E2E tests
        run: pytest -q --override-ini='addopts=' -m external_tool tests/release/test_optional_external_e2e.py -k "gitleaks or trivy"

  optional-workspace-runners:
    name: opt-in Docker/worktree E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run opt-in workspace runner E2E tests
        run: pytest -q --override-ini='addopts=' -m external_tool tests/release/test_optional_external_e2e.py -k "docker_runner_e2e or worktree_runner_e2e"
