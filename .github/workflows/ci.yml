name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-room:
    name: clean-room / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record Git baseline for explicit loop execution
        run: git --version
      - name: Install package and build tooling
        run: python -m pip install build .
      - name: Verify README and package contracts
        run: python -m pytest -q tests/release/test_package_contract.py
      - name: Verify documented loop output
        run: python scripts/verify_readme_outputs.py
      - name: Verify wheel in a clean environment
        run: python scripts/verify_clean_room.py

  core:
    name: deterministic core / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Run deterministic offline suite
        run: uv run pytest -q
      - name: Lint deterministic source and tests
        run: uv run ruff check --no-cache bounded_loops tests
      - name: Type-check runtime and tests
        run: uv run mypy bounded_loops tests
      - name: Audit loop catalog
        run: uv run python -m bounded_loops.cli audit-loops --json
      # REL-07: pip-audit scans the locked dependency graph for known CVEs using
      # the OSV database (offline-capable). Pinned to a specific version to prevent
      # non-deterministic CI failures from tool API changes. This step BLOCKS: a
      # newly-introduced vulnerable transitive dependency should never reach PyPI.
      # Rationale for blocking vs. informational: bounded-loops is a security
      # product whose headline claim is auditable, tamper-resistant loops — having
      # an unscanned dependency graph contradicts that claim.
      - name: Audit dependency CVEs (REL-07)
        run: uv run --with pip-audit==2.8.0 pip-audit

  convergence-correctness:
    # TEST-03: The two convergence-demo tests and the citation-convergence test verify
    # the product's core behavioral promise: that a bounded loop converges, respects
    # bounds, and correctly detects done-state. All three are marked `external_tool`
    # and excluded from `core` by pyproject.toml's addopts. They use stub runners
    # (cassettes) and do NOT require real subscription CLIs or external network access
    # — the `external_tool` marker is present because `bl run` spawns a subprocess.
    # `--override-ini='addopts='` lifts the marker exclusion without touching pyproject.
    # Running on ubuntu-latest is sufficient: stub runner + pytest gate are both
    # present in the dev environment; no Seatbelt/macOS capability required.
    name: convergence behavioral correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Run convergence behavioral correctness tests (TEST-03)
        # --override-ini='addopts=' clears the marker exclusion filter for this
        # specific selection only. The three tests use stub cassettes — no real
        # LLM, no subscription CLI, no network — so they run hermetically here.
        run: |
          uv run pytest -v --override-ini='addopts=' \
            tests/loops/test_convergence_demo.py \
            tests/loops/test_citation_convergence.py

  optional-slm:
    # TEST-06: slm_client.py ships as a first-class adapter but has 0% coverage
    # in default CI because superlocalmemory is an optional dependency. This job
    # installs it and runs the adapter tests that are skipped elsewhere.
    name: optional SLM adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Install optional superlocalmemory dependency
        run: uv pip install "superlocalmemory>=4.0.1"
      - name: Run SLM adapter tests with optional dep present
        run: |
          uv run pytest -v --override-ini='addopts=' \
            tests/graph/adapters/test_slm_client.py

  macos-egress-cage:
    name: macOS OS egress cage (live) / py${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      # The ALLOWLIST egress tests are skipif-gated on a REAL Seatbelt cage. On a runner
      # that cannot enforce one they would SKIP, and this job would report success while
      # proving nothing — the exact blind spot this job exists to close. So assert the
      # capability first, with the engine's own probe, and fail loudly if it is absent.
      - name: Assert this runner can enforce the OS egress cage
        run: |
          uv run python - <<'PY'
          from bounded_loops.graph.adapters.enforcement.capabilities import probe_platform

          caps = probe_platform()
          print(f"seatbelt={caps.seatbelt} egress_proxy={caps.egress_proxy}")
          if not (caps.seatbelt and caps.egress_proxy):
              raise SystemExit(
                  "this macOS runner cannot enforce the loopback egress cage, so the live "
                  "ALLOWLIST tests would silently skip - failing instead of passing blind"
              )
          PY
      - name: Run the deterministic suite with the cage live
        run: uv run pytest -q -rs

  optional-python-gates:
    name: optional Python gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and Python gate tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install semgrep great_expectations
      - name: Run opt-in Python tool E2E tests
        run: pytest -q --override-ini='addopts=' -m external_tool tests/release/test_optional_external_e2e.py -k "semgrep or great_expectations"

  optional-node-gates:
    name: opt-in network Node gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and promptfoo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm install -g promptfoo
      - name: Test npm launcher version parity
        working-directory: npm
        run: npm test
      - name: Run opt-in network promptfoo E2E test
        run: pytest -q --override-ini='addopts=' -m "external_tool and network" tests/release/test_optional_external_e2e.py -k promptfoo

  optional-security-gates:
    name: optional security gate E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Install package and gitleaks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run opt-in security gate E2E tests
        run: pytest -q --override-ini='addopts=' -m external_tool tests/release/test_optional_external_e2e.py -k "gitleaks or trivy"

  optional-workspace-runners:
    name: opt-in Docker/worktree E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run opt-in workspace runner E2E tests
        run: pytest -q --override-ini='addopts=' -m external_tool tests/release/test_optional_external_e2e.py -k "docker_runner_e2e or worktree_runner_e2e"
