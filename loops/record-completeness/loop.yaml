name: record-completeness
description: >
  Drive an agent until every record in a JSON dataset carries a checksum field. The gate is
  `seed/check_records.py` — dependency-free standard library, so it runs anywhere Python does: no
  network, no external tool, no API key. It reports the outstanding violation COUNT rather than a
  bare pass/fail, so progress is visible per attempt and a predicted convergence length can be
  checked against the observed one.

  Unlike the cassette-replay loops in this catalogue, the shipped worker repairs a BOUNDED amount of
  work per attempt (one record). Attempts consumed is therefore a
  function of the workload, which makes a declared `max_iterations` something you can watch being
  spent instead of a number that is never approached. Use this loop to see what your budget actually
  buys before you trust one in production.
pattern: evaluator-optimizer
role:
- quality
- engineering
rung: L2
spec: PROMPT.md
forbid:
# The gate: an agent that can rewrite its own acceptance criterion is not gated at all.
- seed/check_records.py
# The worker script IS the agent, not an artifact the gate certifies. Forbidding it stops an
# agent rewriting its own body to trivially satisfy the gate, and keeps `records.json` the
# loop's single mutable artifact -- a second one puts the loop in the evaluation harness's
# multi-artifact skip bucket, where it contributes nothing to the false-accept rate.
- seed/worker.py
runner:
  default: shell
  agent_cmd: python3 seed/worker.py
gate:
  kind: command
  run: python3 seed/check_records.py seed/records.json
bounds: bounds.yaml
memory: STATE.md
